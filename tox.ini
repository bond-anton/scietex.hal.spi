[tox]
env_list =
    format
    lint
    type
    py{310,312,314}
    core

[testenv:format]
description = check formatting with ruff
deps =
    ruff==0.17.4
commands =
    ruff format --check .

[testenv:lint]
description = run ruff checks on the codebase
deps =
    ruff==0.17.4
commands =
    ruff check .

[testenv:type]
description = run type checks on src
deps =
    ty==0.0.99
commands =
    ty check src

[testenv:core]
description = prove the core install needs neither optional backend
extras =
deps =
    pytest
commands =
    python -c "import importlib.util, sys; found = [n for n in ('spidev', 'gpiozero') if importlib.util.find_spec(n)]; sys.exit('optional backend installed: %s' % found if found else 0)"
    pytest {posargs:tests/test_optional_backends.py}

[testenv]
description = install the optional backends and run the test suite
extras = dev
commands =
    pytest tests {posargs}
